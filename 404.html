<!DOCTYPE html>

<style>
:root{--cream:#FBF6EF;--rose:#F2D5D9;--bordeaux:#7A1F3D;--ink:#2A1F24;--ink-soft:#6B5A62;--font-d:'Fraunces',Georgia,serif;--font-b:'Outfit',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:var(--font-b);padding:24px;text-align:center;background-image:radial-gradient(60% 50% at 50% 0%,rgba(242,213,217,.55),transparent 70%)}
.wrap{max-width:560px}
.code{font-family:var(--font-d);font-size:clamp(64px,16vw,120px);line-height:1;color:var(--bordeaux);opacity:.16;font-weight:300}
h1{font-family:var(--font-d);font-weight:400;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:-10px 0 14px}
p{color:var(--ink-soft);line-height:1.65;margin-bottom:28px}
a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--bordeaux);color:#fff;text-decoration:none;font-weight:600;padding:15px 28px;border-radius:10px;transition:transform .2s,background .2s}
a.btn:hover{transform:translateY(-2px);background:#5f1730}
.credit{margin-top:30px;font-size:12px;color:var(--ink-soft)}
.credit a{color:var(--bordeaux);text-decoration:none;font-weight:600}
.credit a:hover{text-decoration:underline}
.mark{width:42px;height:42px;margin:0 auto 18px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:var(--bordeaux)}
</style>
</head>
<body>
<main class="wrap">
