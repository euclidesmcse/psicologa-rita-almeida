apiVersion: apps/v1
kind: Deployment
metadata:
  name: psicologa-site
  labels:
    app: psicologa-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: psicologa-site
  template:
    metadata:
      labels:
        app: psicologa-site
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: html
          configMap:
            name: psicologa-html
---
apiVersion: v1
kind: Service
metadata:
  name: psicologa-site
spec:
  type: NodePort
  selector:
    app: psicologa-site
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
