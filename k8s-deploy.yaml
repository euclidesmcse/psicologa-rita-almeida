apiVersion: apps/v1
kind: Deployment
metadata:
  name: psicologa-site
  labels:
    app: psicologa-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: psicologa-site
  template:
    metadata:
      labels:
        app: psicologa-site
    spec:
      containers:
        - name: nginx
          image: psicologa-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: psicologa-site
spec:
  type: NodePort
  selector:
    app: psicologa-site
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
